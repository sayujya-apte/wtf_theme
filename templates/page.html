{% extends "base.html" %}

{% block content %}
  {% if request.path == "/" %}
    <script>
      window.location.replace("{{ url_for('challenges.listing') }}");
    </script>
  {% else %}
    <div class="container">
      {{ content | safe }}
    </div>
  {% endif %}
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/page.js") }}
{% endblock %}
